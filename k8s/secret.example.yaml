# DevOps Learning OS — Kubernetes Secret template
#
# This is a PLACEHOLDER template. The real secret manifest (k8s/secret.yaml)
# is git-ignored and must be created locally on the cluster server.
#
# Setup (on the k8s server):
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values, then:
#   kubectl apply -f k8s/secret.yaml
#
# Alternatively, create the secret imperatively without any file at all:
#   kubectl -n devops-learning-os create secret generic learning-os-secret \
#     --from-literal=POSTGRES_PASSWORD='<strong-random-password>' \
#     --from-literal=AUTH_SECRET='<64-char-random-string>'
#
# The DATABASE_URL inside k8s/learning-os.yaml is a static connection string
# that must match POSTGRES_PASSWORD. If you change the password, also patch
# the DATABASE_URL key in the same secret:
#   kubectl -n devops-learning-os patch secret learning-os-secret \
#     -p '{"stringData":{"DATABASE_URL":"postgresql://devops_admin:<NEW-PASSWORD>@postgres-service.devops-learning-os.svc.cluster.local:5432/devops_learning_os?schema=public"}}'
apiVersion: v1
kind: Secret
metadata:
  name: learning-os-secret
  namespace: devops-learning-os
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_strong_postgres_password"
  AUTH_SECRET: "CHANGE_ME_long_random_jwt_secret"
  DATABASE_URL: "postgresql://devops_admin:CHANGE_ME_strong_postgres_password@postgres-service.devops-learning-os.svc.cluster.local:5432/devops_learning_os?schema=public"
