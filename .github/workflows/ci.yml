name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # packages:write is required to publish to GHCR with the built-in GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build Application & Server
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish to GHCR only on pushes to main; PRs still lint/test/build above.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mauricevanlavieren-lab/learning-platform:latest
            ghcr.io/mauricevanlavieren-lab/learning-platform:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PRs: build only (no push, no registry login), still exercises the Dockerfile.
      - name: Build Docker Image (PR dry run)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/mauricevanlavieren-lab/learning-platform:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
